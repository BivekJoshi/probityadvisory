      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap"
    />

    <script>
      // Paint the stored theme before first frame so the page never flashes.
      (function () {
        try {
          var stored = localStorage.getItem('probity-theme');
          var dark = stored
            ? stored === 'dark'
            : window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (dark) document.documentElement.classList.add('dark');
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <a
      href="#main"
      style="position:fixed;top:-60px;left:16px;z-index:3000;background:#C9A227;color:#20180A;font:500 14px system-ui;padding:12px 20px;border-radius:0 0 4px 4px;text-decoration:none;transition:top .25s"
      onfocus="this.style.top='0'"
      onblur="this.style.top='-60px'"
      >Skip to content</a
    >
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
