name: CI

# Catches broken builds before they reach PRODUCTION (and therefore cPanel).
# Deploys are handled by deploy.yml, which runs only on PRODUCTION.

on:
  pull_request:
    branches: [main, PRODUCTION]
  push:
    # PRODUCTION is excluded: deploy.yml already builds it.
    branches-ignore: [PRODUCTION]

jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ vars.NODE_VERSION || '22' }}
          cache: npm

      - run: npm ci

      # Advisory for now, so pre-existing lint errors do not block every PR.
      # Drop `continue-on-error` once the tree is clean.
      - name: Lint
        run: npm run lint
        continue-on-error: true

      # Type-checks (tsc -b) and bundles into dist/.
      - name: Build
        run: npm run build

      - name: Fail if the build looks empty
        run: |
          test -f dist/index.html || { echo "dist/index.html missing"; exit 1; }
          test -d dist/assets     || { echo "dist/assets missing";     exit 1; }
